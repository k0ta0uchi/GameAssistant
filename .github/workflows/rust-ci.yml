name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rust-check:
    name: Rust Build & Test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      PROTOC: ${{ github.workspace }}/tools/protoc/bin/protoc.exe
      PROTOC_INCLUDE: ${{ github.workspace }}/tools/protoc/include

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-14
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Fast tests
        run: .\scripts\test-rust.ps1 -Suite Fast

      - name: Run Full tests
        run: .\scripts\test-rust.ps1 -Suite Full
