<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameAssistant</title>
    <style>
      /* 起動直後 (0ms) に即時表示されるシンプル・ミニマルなネイティブローディング */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #08090a;
        color: #d0d6e0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
        user-select: none;
      }

      #app-startup-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #08090a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      #app-startup-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .startup-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 320px;
        width: 90%;
      }

      .startup-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.08);
        border-top-color: #e4f222;
        animation: startup-spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        margin-bottom: 24px;
      }

      @keyframes startup-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .startup-app-name {
        font-size: 16px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #f3f4f6;
        margin-bottom: 6px;
      }

      .startup-status-text {
        font-size: 13px;
        color: #6e7681;
        min-height: 18px;
      }

      .startup-line-container {
        width: 140px;
        height: 2px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 2px;
        margin-top: 20px;
        overflow: hidden;
        position: relative;
      }

      .startup-line-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        background: #e4f222;
        border-radius: 2px;
        animation: startup-progress 1.5s ease-in-out infinite;
      }

      @keyframes startup-progress {
        0% { transform: translateX(-100%); width: 30%; }
        50% { transform: translateX(50%); width: 60%; }
        100% { transform: translateX(200%); width: 30%; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#08090a] text-[#d0d6e0] font-sans antialiased select-none overflow-hidden">
    <!-- 起動時即時プレローダー (0msから即表示) -->
    <div id="app-startup-loader">
      <div class="startup-content">
        <div class="startup-spinner"></div>
        <div class="startup-app-name">GameAssistant</div>
        <div class="startup-status-text">起動しています...</div>
        <div class="startup-line-container">
          <div class="startup-line-fill"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
